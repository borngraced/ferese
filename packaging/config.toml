# User configuration: ~/.config/ferese/config.toml
# Unspecified monitors use automatic placement and preferred modes.
[commands]
terminal = ["foot"]
screenshot = ["ferese-screenshot"]

[input]
xkb_layout = "us"
focus_follows_mouse = false

[layout]
smart_gaps = false

# Edge-to-edge menu bar; its foreground palette is independent of popup surfaces.
[theme.surface.bar]
background = "#1C202E"
opacity = 0.95
text_primary = "#F0F3FA"
text_muted = "#AAB4C7"

# Super+Enter opens Foot. Super+Shift+S selects a screenshot. Super+Shift+E logs out.
# See README.md for monitor profiles and additional bindings.

[[window_rules]]
app_id = "dev.ferese.Settings"
floating = true

[[window_rules]]
title = "Choose a wallpaper"
floating = true

# Optional desktop clock; all dimensions are logical pixels.
[desktop_widgets.clock]
enabled = false
anchor = "top_left"
margin_x = 64
margin_y = 80
time_size = 72.0
date_size = 18.0
opacity = 0.9
