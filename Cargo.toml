[workspace]
members = [
    "compositor",
    "crates/ferese-animation",
    "crates/ferese-core",
    "crates/ferese-layout",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
libc = "0.2.176"
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
xcursor = "0.3.11"
